plugins {
    id 'java'
    id 'jacoco'
    id "org.openapi.generator" version "7.26.0"
    id 'com.gradleup.shadow' version '9.6.1'
    id("io.freefair.lombok") version "9.8.2"
}

import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

project.ext {
    publishRepo = "https://maven.pkg.github.com/reportportal/plugin-bts-jira"
    dependencyRepos = ["plugin-api", "commons-bom"]
    releaseMode = project.hasProperty("releaseMode")
    pluginID = "jira"
    pluginsDir = layout.buildDirectory.dir("plugins").get().asFile.path
}

def scriptsUrl = 'https://raw.githubusercontent.com/reportportal/gradle-scripts/' +
        (releaseMode ? getProperty('scripts.version') : 'develop')

apply from: scriptsUrl + '/release-fat.gradle'
apply from: scriptsUrl + '/signing.gradle'

repositories {
    mavenCentral()
    maven { url = "https://build.shibboleth.net/nexus/content/repositories/releases/" }
    maven { url = "https://m2proxy.atlassian.com/repository/public" }

    if (!releaseMode) {
        maven { url = 'https://jitpack.io' }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    if (releaseMode) {
        implementation 'com.epam.reportportal:service-api'
        annotationProcessor('com.epam.reportportal:service-api') {
            exclude group: 'org.springframework.modulith', module: 'spring-modulith-apt'
        }
    } else {
        implementation 'com.github.reportportal:service-api:d4b2f7c'
        annotationProcessor('com.github.reportportal:service-api:d4b2f7c') {
            exclude group: 'org.springframework.modulith', module: 'spring-modulith-apt'
        }
    }
    implementation 'tools.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-autoconfigure'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.hamcrest:hamcrest'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java {
            srcDirs layout.buildDirectory.dir("generated/src/main/java").get().asFile.path
        }
    }
}

javadoc {
    source = fileTree(dir: "src/main/java")
}


tasks.register('generateJiraApi', GenerateTask) {
    generatorName.set("java")
    inputSpec.set(layout.projectDirectory.file("src/main/resources/openapi/swagger-v3.v3.json"))
    outputDir.set(layout.buildDirectory.dir("generated"))
    configFile.set(layout.projectDirectory.file("src/main/resources/openapi/config.json"))
    ignoreFileOverride.set(layout.projectDirectory.file(".openapi-generator-ignore"))
    skipOverwrite.set(true)
}

assemble.dependsOn shadowJar

test {
    useJUnitPlatform()
    jacocoTestReport {
        reports {
            xml.required = true
        }
    }
}

build.dependsOn jacocoTestReport

wrapper {
    gradleVersion = '9.3.1'
}

generatePomFileForShadowPublication { pom.packaging = "jar" }

jar {
    processResources.exclude('openapi')
    manifest {
        attributes(
                "Class-Path": configurations.compileClasspath.collect { it.getName() }.join(' '),
                "Plugin-Id": "${pluginID}",
                "Plugin-Version": "${project.version}",
                "Plugin-Provider": "Andrei Varabyeu",
                "Plugin-Class": "com.epam.reportportal.extension.bugtracking.jira.JiraStrategyPlugin",
                "Plugin-Service": "api"
//                "Plugin-Dependencies": ""
        )
    }
}

shadowJar {
    configurations = [project.configurations.compileClasspath]
    zip64 = true
    dependencies {
        include(dependency("jakarta.ws.rs:jakarta.ws.rs-api:.*"))
        include(dependency("org.apache.tomcat:tomcat-annotations-api:.*"))
    }
}

def pluginZip = tasks.register('plugin', Jar) {
    archiveBaseName.set("plugin-${pluginID}")
    into('classes') {
        with tasks.named('jar').get()
    }
    into('lib') {
        from configurations.compileClasspath
    }
    archiveExtension.set('zip')
}

tasks.register('assemblePlugin', Copy) {
    from pluginZip
    into pluginsDir
}

compileJava.dependsOn generateJiraApi
